name: Din Tai Fung Reservation Bot

on:
  schedule:
    # Midnight AZ time (MST = UTC-7, no DST) on Sundays → 07:00 UTC
    - cron: '0 7 * * 0'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Run reservation bot
        env:
          PARTY_SIZE:       ${{ vars.PARTY_SIZE || '5' }}
          CONTACT_NAME:     ${{ secrets.CONTACT_NAME }}
          CONTACT_EMAIL:    ${{ secrets.CONTACT_EMAIL }}
          CONTACT_PHONE:    ${{ secrets.CONTACT_PHONE }}
          YELP_SESSION:     ${{ secrets.YELP_SESSION }}
          TARGET_DAYS:      ${{ vars.TARGET_DAYS || 'Saturday,Sunday' }}
          EARLIEST_HOUR:    ${{ vars.EARLIEST_HOUR || '17' }}
          LATEST_HOUR:      ${{ vars.LATEST_HOUR || '19' }}
          PREFERRED_TIMES:  ${{ vars.PREFERRED_TIMES || '1700,1730,1800,1830,1900' }}
          FAIL_ON_NO_SLOT:  ${{ vars.FAIL_ON_NO_SLOT || 'false' }}
        run: python bot.py

      - name: Upload screenshots (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
